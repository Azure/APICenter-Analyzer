name: Validate AZD template
on:
  # push:
  #   branches:
  #     - main
  #     - preview
  #   paths:
  #     - "infra/**"
  # pull_request:
  #   branches:
  #     - main
  #     - preview
  #   paths:
  #     - "infra/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Microsoft Security DevOps Analysis
        uses: microsoft/security-devops-action@cf28f87c67770dbaa208cce3665fafc849f77507 # v1.12.1
        id: msdo
        continue-on-error: true
        with:
          tools: templateanalyzer

      - name: Upload alerts to Security tab
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        if: github.repository_owner == 'Azure'
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
